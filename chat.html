<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk to Geraldine – MedClear</title>
<meta name="description" content="Describe how you feel. Geraldine, MedClear's AI health guide, asks the right questions and tells you what to do next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f8f8;--surface:#fff;--ink:#0e2a2f;--mute:#546b70;--line:#d9e3e4;--teal:#0b6b63;--teal-ink:#fff;--teal-soft:#e2f2ef;--red:#b3261e;--red-soft:#fdeceb;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0b1819;--surface:#112325;--ink:#e8f3f2;--mute:#9db7b9;--line:#24403f;--teal:#4fd1c0;--teal-ink:#04211d;--teal-soft:#123532;--red:#ffb4ab;--red-soft:#3a1a18;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header a{color:var(--ink);text-decoration:none;font-size:1.4rem;line-height:1;padding:4px 8px 4px 0}
.av{width:42px;height:42px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-weight:800;flex:none}
.who b{display:block;line-height:1.2}
.who span{font-size:.8rem;color:var(--mute)}
.ai{display:inline-block;font-size:.7rem;font-weight:800;border:1.5px solid var(--teal);color:var(--teal);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:middle}
.emerg{background:var(--red-soft);color:var(--red);font-size:.8rem;font-weight:600;padding:7px 16px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.m{max-width:86%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.m.dr{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.m.me{background:var(--teal);color:var(--teal-ink);border-bottom-right-radius:5px;align-self:flex-end;font-weight:500}
.m.urgent{border:2px solid var(--red);background:var(--red-soft);color:var(--ink)}
.dots{display:flex;gap:5px;padding:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.qr{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
.qr button{border:1.5px solid var(--teal);background:transparent;color:var(--teal);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:.92rem;cursor:pointer}
.err{align-self:center;background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.92rem}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
form .in{display:flex;gap:8px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;font:inherit;background:var(--paper);color:var(--ink);resize:none;max-height:120px}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
form button{border:0;background:var(--teal);color:var(--teal-ink);border-radius:22px;padding:0 20px;font:inherit;font-weight:800;cursor:pointer}
form button:disabled{opacity:.5}
.note{text-align:center;color:var(--mute);font-size:.76rem;padding:0 16px 6px;background:var(--surface)}
</style>
</head>
<body>
<header>
<a href="/" aria-label="Back to MedClear">←</a>
<div class="av">G</div>
<div class="who"><b>Geraldine<span class="ai">AI</span></b><span>MedClear's AI health guide. Not a real doctor.</span></div>
</header>
<div class="emerg">Emergency? Go to the nearest hospital or call your local emergency number (112 in Nigeria).</div>
<div id="log" aria-live="polite"></div>
<div class="note">Information only. Not a diagnosis, and no prescriptions or doses.</div>
<form id="f"><div class="in">
<textarea id="t" rows="1" placeholder="Tell me what is bothering you…" aria-label="Describe how you feel"></textarea>
<button id="s" type="submit">Send</button>
</div></form>
<script>
(function(){
var log=document.getElementById('log'),f=document.getElementById('f'),t=document.getElementById('t'),s=document.getElementById('s');
var msgs=[],busy=false;
function el(tag,c,x){var e=document.createElement(tag);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function clearQR(){var q=log.querySelectorAll('.qr');q.forEach(function(n){n.remove()})}
function bottom(){log.scrollTop=log.scrollHeight}
function dr(text,urgent){log.appendChild(el('div','m dr'+(urgent?' urgent':''),text));bottom()}
function qr(list){if(!list||!list.length)return;var w=el('div','qr');list.forEach(function(x){var b=el('button',null,x);b.type='button';b.onclick=function(){send(x)};w.appendChild(b)});log.appendChild(w);bottom()}
var hr=new Date().getHours();
var hi=hr>=5&&hr<12?'Good morning':hr>=12&&hr<17?'Good afternoon':'Good evening';
dr(hi+'. I am Geraldine, MedClear’s AI health guide. I am not a real doctor, but I can ask a few questions and help you decide what to do next.\n\nTell me what is bothering you, in your own words.');
qr(['Stomach pain','Headache','Fever','Cough or cold']);

async function send(text){
text=(text||'').trim();if(!text||busy)return;
busy=true;s.disabled=true;clearQR();
log.querySelectorAll('.err').forEach(function(n){n.remove()});
log.appendChild(el('div','m me',text));msgs.push({role:'user',text:text});t.value='';t.style.height='auto';
var ty=el('div','m dr dots');ty.innerHTML='<i></i><i></i><i></i>';log.appendChild(ty);bottom();
try{
var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs})});
if(!r.ok)throw 0;
var d=await r.json();if(!d.reply)throw 0;
ty.remove();msgs.push({role:'model',text:d.reply});dr(d.reply,d.urgent);if(!d.urgent)qr(d.quick_replies);
}catch(e){
ty.remove();msgs.pop();
var er=el('div','err','I could not reply just now. Please send that again.');log.appendChild(er);bottom()}
busy=false;s.disabled=false;t.focus()}

f.onsubmit=function(e){e.preventDefault();send(t.value)};
t.oninput=function(){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'};
t.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();send(t.value)}};
})();
</script>
</body>
</html>
